; ============================================================================
; EasyAltium (LCSC Loader) - Host <-> Altium 26.10.1 IPC Veri Sözleşmesi
; Dosya: ipc/current_part.ini
; Kodlama: UTF-8 (BOM'suz) veya ANSI (TMemIniFile uyumlu)
; ============================================================================

[Transaction]
; Her işlem için C# istemci tarafından üretilen tekil GUID
RequestId=8f9d2a1b-4c3e-4b7a-9e12-7c6d5e4f3a2b
; İşlem zaman damgası (ISO-8601 UTC)
TimestampUtc=2026-10-24T14:25:00Z
; Çalıştırılacak işlem: PlaceOrLoad | LoadOnly | FallbackMakeLibrary
Action=PlaceOrLoad
; Kütüphane çalışma modu: MasterLib (Mod A) | SqliteDbLib (Mod B)
LibraryMode=SqliteDbLib
; Şematik açıksa yerleştirme yöntemi:
;   InteractiveCursor = Parçayı tüm BOM parametreleriyle oluşturur ve fare ucuna verir
;   DirectToSheet     = Parçayı doğrudan aktif şematik sayfasının merkezine/koordinatına ekler
PlacementMethod=InteractiveCursor
; DirectToSheet seçiliyse veya başlangıç koordinatı gerekiyorsa (Mils cinsinden)
TargetX_Mils=2000
TargetY_Mils=2000
; Aktif .SchDoc açık değilse ilgili .SchLib dosyasını Altium'da aç (1=Evet, 0=Hayır)
OpenLibraryIfNoSchDoc=1
; Sessiz mod (1=Hata dışında ShowMessage diyalogu gösterme, 0=Bilgi mesajı göster)
SilentMode=1
; DelphiScript çalışma log dosyasının tam yolu
LogFilePath=D:\wb\antigravity\easyaltium-q\ipc\bridge_status.log

[LibraryPaths]
; Birincil Şematik Kütüphanesi (.SchLib) tam yolu
SchLibPath=D:\wb\antigravity\easyaltium-q\Library\SchLib\LCSC_Master.SchLib
; Birincil Footprint Kütüphanesi (.PcbLib) tam yolu
PcbLibPath=D:\wb\antigravity\easyaltium-q\Library\PcbLib\LCSC_Master.PcbLib
; İndirilen 3D STEP modelinin (.step) tam yolu
StepModelPath=D:\wb\antigravity\easyaltium-q\Library\STEP\C2040_RP2040.step
; Mod B (SQLite .DbLib) aktifse .DbLib dosyasının tam yolu
DbLibPath=D:\wb\antigravity\easyaltium-q\Library\DbLib\EasyAltium_LCSC.DbLib
; Mod B içerisindeki hedef SQLite tablo adı (Resistors, Capacitors, Inductors, ICs, Connectors, Discrete, Misc)
DbTableName=ICs
; Pasif eleman sembol filtresi aktif mi? (1=Yerel standart sembolü kullan, 0=LCSC sembolünü kullan)
UsePassiveTemplateSymbol=0
; UsePassiveTemplateSymbol=1 ise kullanılacak yerel standart şablon .SchLib yolu
PassiveTemplateSchLibPath=D:\wb\antigravity\easyaltium-q\altium-bridge\Templates\Standard_Passives.SchLib
; UsePassiveTemplateSymbol=1 ise şablon kütüphanedeki sembol referans adı (Örn: RES_STD, CAP_NP_STD, IND_STD)
PassiveTemplateLibRef=RES_STD
; FallbackMakeLibrary aksiyonu için EasyEDA ASCII kaynak dosyaları
FallbackSchDocPath=D:\wb\antigravity\easyaltium-q\Library\Fallback\C2040_Raw.SchDoc
FallbackPcbDocPath=D:\wb\antigravity\easyaltium-q\Library\Fallback\C2040_Raw.PcbDoc

[Component]
; LCSC Parça Numarası
LcscId=C2040
; .SchLib içerisindeki sembol adı (Symbol Reference / Library Ref)
LibRef=RP2040
; .PcbLib içerisindeki kılıf adı (Footprint Reference)
FootprintRef=QFN-56_L7.0-W7.0-P0.40-TL-EP3.2
; Şematik Designator öneki (Örn: U?, R?, C?, L?, J?, D?, Q?)
DesignatorPrefix=U?
; Şematik Comment alanı (MPN veya Pasif Değer, Örn: RP2040 veya 10k 1%)
Comment=RP2040
; Parça açıklaması
Description=Dual-Core ARM Cortex-M0+ 133MHz 264KB SRAM Microcontroller QFN-56
; Çok parçalı (multi-part) bileşenlerde alt parça sayısı (Standart = 1)
PartCount=1
; Kategori
Category=ICs

[Parameters]
; Bu bölümdeki tüm anahtar=değer çiftleri dinamik olarak okunur ve
; yerleştirilen ISch_Component nesnesine BOM parametresi olarak eklenir/güncellenir.
LCSC_Part=C2040
MPN=RP2040
Manufacturer=Raspberry Pi
Package=LQFN-56(7x7)
JLCPCB_Class=Extended
Datasheet_URL=https://www.lcsc.com/datasheet/lcsc_datasheet_2106071534_Raspberry-Pi-RP2040_C2040.pdf
Supplier=LCSC
Supplier_Part=C2040
Stock=48520
Unit_Price_USD=0.8024
RoHS=YES

[Result]
; Bridge.pas çalışmayı tamamladığında bu bölümü günceller:
; State: PENDING | SUCCESS | ERROR
State=PENDING
ExecutedAction=None
TargetDocument=None
ErrorMessage=
CompletedAt=
